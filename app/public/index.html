<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidlock — Fridge Lock</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="home">
  <main class="home-main" data-state="idle">
    <section class="home-idle">
      <span class="mark">◆</span>
      <h1>Open your fridge</h1>
      <p class="sub">Look at the camera to unlock.</p>
      <button type="button" id="openBtn" class="btn primary home-cta">Open fridge</button>
    </section>

    <section class="home-scan">
      <div class="scanner">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <canvas id="canvas" hidden></canvas>
        <p id="hint" class="hint" hidden></p>
        <div class="bracket tl"></div>
        <div class="bracket tr"></div>
        <div class="bracket bl"></div>
        <div class="bracket br"></div>
      </div>
      <p id="scanStatus" class="status">Starting camera…</p>
      <button type="button" id="cancelBtn" class="btn ghost">Cancel</button>
    </section>

    <section class="home-result">
      <div id="resultIcon" class="result-icon"></div>
      <h1 id="resultTitle"></h1>
      <p id="resultText" class="sub"></p>
      <button type="button" id="againBtn" class="btn ghost home-cta">Try again</button>
      <p id="demoNote" class="demo-note" hidden>Demo mode — no lock connected yet, so this result is simulated.</p>
    </section>
  </main>

  <footer class="home-footer">
    <a href="enroll.html" class="enroll-link">Enroll a new face →</a>
  </footer>

  <script type="module" src="home.js"></script>
</body>
</html>
